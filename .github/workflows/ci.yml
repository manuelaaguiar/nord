name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guarda do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/guard-repo.mjs

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Varrer todo o histórico
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose --exit-code 1'

  app:
    name: Testes, tipos e build
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v7
      # Os passos do app são ignorados até o código ser importado (package.json ausente).
      - id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "package.json ausente: passos do app ignorados."
          fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm run install:ci
      - if: steps.app.outputs.present == 'true'
        run: npm test
      - if: steps.app.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.app.outputs.present == 'true'
        run: npm run build
      - if: steps.app.outputs.present == 'true'
        run: npm run check:secrets
